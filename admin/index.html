<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Админ-панель — редактирование сайта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="app">
    <section class="login" id="login-view" hidden>
      <form class="login-card" id="login-form" autocomplete="on">
        <h1>Вход в админ-панель</h1>
        <p class="muted">Редактирование содержания сайта ремонта вариаторов</p>
        <label>Логин<input name="username" required autocomplete="username"></label>
        <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
        <p class="msg msg--error" id="login-error" hidden></p>
        <p class="msg msg--ok" id="login-status" hidden></p>
        <button class="btn btn--primary" type="submit" id="login-submit">Войти</button>
      </form>
    </section>

    <div class="shell" id="admin-view" hidden>
      <header class="top">
        <button type="button" class="btn btn--ghost menu-btn" id="menu-toggle" aria-label="Меню">☰</button>
        <div>
          <strong>Админ-панель</strong>
          <span class="muted" id="user-label"></span>
        </div>
        <div class="top-actions">
          <a class="btn btn--ghost" href="/" target="_blank" rel="noopener">Сайт</a>
          <button class="btn btn--ghost" type="button" id="logout-btn">Выйти</button>
        </div>
      </header>

      <aside class="nav" id="nav">
        <button type="button" data-section="texts" class="is-active">Тексты</button>
        <button type="button" data-section="contacts">Контакты</button>
        <button type="button" data-section="services">Услуги и цены</button>
        <button type="button" data-section="parts">Запчасти</button>
        <button type="button" data-section="cases">Примеры</button>
        <button type="button" data-section="gallery">Фотографии</button>
      </aside>

      <main class="main">
        <div class="toolbar sticky">
          <p class="status" id="status"></p>
          <div class="toolbar-actions">
            <button class="btn btn--ghost" type="button" id="cancel-btn">Отменить</button>
            <button class="btn btn--primary" type="button" id="save-btn">Сохранить</button>
          </div>
        </div>
        <div id="panels"></div>
      </main>
    </div>
  </div>
  <script src="admin.js" type="module"></script>
</body>
</html>
